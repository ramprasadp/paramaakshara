<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paramaakshara</title>
  </head>
  <body>
    <header class="toolbar">
      <strong class="app-name">Paramaakshara</strong>
      <span id="version" class="version"></span>
      <span class="group" aria-label="File">
        <button id="file-new" type="button" disabled>New</button>
        <button id="file-open" type="button" title="Open (⌘O)" disabled>
          Open…
        </button>
        <button id="file-save" type="button" title="Save (⌘S)" disabled>
          Save
        </button>
        <button id="file-save-as" type="button" title="Save as (⇧⌘S)" disabled>
          Save as…
        </button>
        <button
          id="file-import"
          type="button"
          title="Open an ITRANS, Baraha or Unicode text file from anywhere on this computer"
          disabled
        >
          Import…
        </button>
        <button
          id="legacy-pdf"
          type="button"
          title="Open a PDF typeset with legacy (non-Unicode) fonts such as Shree-Lipi; its text is converted to Unicode and then rewritten in ITRANS"
          disabled
        >
          Legacy PDF…
        </button>
        <button
          id="baraha"
          type="button"
          title="Paste text typed in Baraha; # q $ and Baraha letters are rewritten in ITRANS"
        >
          Baraha…
        </button>
        <button
          id="file-export"
          type="button"
          title="Download the Unicode output as a .txt file"
        >
          Export .txt
        </button>
        <button
          id="export-pdf"
          type="button"
          title="Print the Unicode output, or save it as a PDF"
        >
          Export PDF…
        </button>
        <button
          id="export-all"
          type="button"
          title="Write name.itrans.txt, name.uni.txt and name.pdf to a document folder"
          disabled
        >
          Export all…
        </button>
      </span>
      <span id="docname" class="docname"></span>
      <span class="spacer"></span>
      <button
        id="reference"
        type="button"
        title="How to type avagraha, om, conjuncts and Vedic accents in ITRANS"
      >
        Reference…
      </button>
      <button
        id="palette-toggle"
        type="button"
        title="Vedic symbol palette"
        aria-controls="palette"
      >
        Symbols…
      </button>
      <button
        id="quit"
        type="button"
        title="Stop Paramaakshara (the app has no Dock icon; quit it here)"
        disabled
      >
        Quit
      </button>
    </header>
    <aside id="palette" class="palette" hidden></aside>
    <main class="panes">
      <section class="pane">
        <h2>
          ITRANS input
          <button
            id="import-unicode"
            type="button"
            class="icon"
            aria-label="Import Unicode"
            title="Import Unicode: paste Devanagari, Kannada or Tamil text; it is rewritten in ITRANS and inserted at the cursor"
          >
            <span class="glyph" aria-hidden="true">अ→a</span>
          </button>
        </h2>
        <div id="source" class="editor"></div>
      </section>
      <section class="pane">
        <h2>
          Unicode output
          <select id="script-select" title="Output script">
            <option value="devanagari">Devanagari</option>
            <option value="kannada">Kannada</option>
            <option value="tamil">Tamil (superscript)</option>
          </select>
          <span
            class="muted pane-note"
            title="The output follows the ITRANS line by line. Correct the ITRANS; copy the output or use Export."
            >read-only</span
          >
        </h2>
        <div id="output" class="editor"></div>
      </section>
    </main>
    <footer class="status">
      <span id="counts"></span>
      <span id="save-state"></span>
      <span class="spacer"></span>
      <span id="converter" class="notice">ITRANS 5.3 → Devanagari</span>
    </footer>
    <div id="banner" class="banner" hidden></div>
    <dialog id="dialog"></dialog>
    <style id="print-page"></style>
    <div id="print-view" aria-hidden="true"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
