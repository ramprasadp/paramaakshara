<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paramaakshara</title>
  </head>
  <body>
    <header class="toolbar">
      <strong class="app-name">Paramaakshara</strong>
      <span id="version" class="version"></span>
      <span class="group" aria-label="File">
        <button id="file-new" type="button" disabled>New</button>
        <button id="file-open" type="button" title="Open (⌘O)" disabled>
          Open…
        </button>
        <button id="file-save" type="button" title="Save (⌘S)" disabled>
          Save
        </button>
        <button id="file-save-as" type="button" title="Save as (⇧⌘S)" disabled>
          Save as…
        </button>
        <button
          id="file-import"
          type="button"
          title="Open a file from anywhere on this computer"
          disabled
        >
          Import…
        </button>
        <button
          id="baraha"
          type="button"
          title="Paste text typed in Baraha; # q $ and Baraha letters are rewritten in ITRANS"
        >
          Baraha…
        </button>
        <button
          id="file-export"
          type="button"
          title="Download the Unicode output as a .txt file"
        >
          Export .txt
        </button>
        <button
          id="export-pdf"
          type="button"
          title="Print the Unicode output, or save it as a PDF"
        >
          Export PDF…
        </button>
        <button
          id="export-all"
          type="button"
          title="Write name.itrans.txt, name.uni.txt and name.pdf to a document folder"
          disabled
        >
          Export all…
        </button>
      </span>
      <span id="docname" class="docname"></span>
      <span class="spacer"></span>
      <span class="group" aria-label="Regenerate">
        <button
          id="regen-line"
          type="button"
          class="icon"
          aria-label="Regenerate line"
          title="Regenerate line: replace the output of the current line with the transliteration of its ITRANS"
        >
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path d="M15 9a6 6 0 1 1-1.76-4.24" />
            <path d="M15.2 2.2v3.2H12" />
            <path d="M6.5 9h5" />
          </svg>
        </button>
        <button
          id="regen-all"
          type="button"
          class="icon"
          aria-label="Regenerate all"
          title="Regenerate all: replace every manually edited line with the transliteration of its ITRANS"
        >
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path d="M15 9a6 6 0 1 1-1.76-4.24" />
            <path d="M15.2 2.2v3.2H12" />
            <path d="M6.5 6.8h5M6.5 9h5M6.5 11.2h5" />
          </svg>
        </button>
      </span>
      <span class="group" aria-label="Insert into output">
        <button
          type="button"
          data-insert="&#x0952;"
          title="Anudātta U+0952 (ITRANS _)"
        >
          ◌॒
        </button>
        <button
          type="button"
          data-insert="&#x0951;"
          title="Svarita U+0951 (ITRANS ')"
        >
          ◌॑
        </button>
        <button
          type="button"
          data-insert="&#x1CDA;"
          title="Double svarita U+1CDA (ITRANS ''')"
        >
          ◌᳚
        </button>
      </span>
      <button
        id="palette-toggle"
        type="button"
        title="Vedic symbol palette"
        aria-controls="palette"
      >
        Symbols…
      </button>
      <button
        id="cleanup"
        type="button"
        title="Fix accent order, Baraha double svarita, short e/o and colon visarga in the selection or the whole output"
      >
        Clean up…
      </button>
      <button
        id="quit"
        type="button"
        title="Stop Paramaakshara (the app has no Dock icon; quit it here)"
        disabled
      >
        Quit
      </button>
    </header>
    <aside id="palette" class="palette" hidden></aside>
    <main class="panes">
      <section class="pane">
        <h2>
          ITRANS input
          <button
            id="import-unicode"
            type="button"
            class="icon"
            aria-label="Import Unicode"
            title="Import Unicode: paste Devanagari, Kannada or Tamil text; it is rewritten in ITRANS and inserted at the cursor"
          >
            <span class="glyph" aria-hidden="true">अ→a</span>
          </button>
        </h2>
        <div id="source" class="editor"></div>
      </section>
      <section class="pane">
        <h2>
          Unicode output
          <select id="script-select" title="Output script (§4.6)">
            <option value="devanagari">Devanagari</option>
            <option value="kannada">Kannada</option>
            <option value="tamil">Tamil (superscript)</option>
          </select>
        </h2>
        <div id="output" class="editor"></div>
      </section>
    </main>
    <footer class="status">
      <span id="counts"></span>
      <span id="save-state"></span>
      <span class="spacer"></span>
      <span id="converter" class="notice">ITRANS 5.3 → Devanagari</span>
    </footer>
    <div id="banner" class="banner" hidden></div>
    <dialog id="dialog"></dialog>
    <style id="print-page"></style>
    <div id="print-view" aria-hidden="true"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
