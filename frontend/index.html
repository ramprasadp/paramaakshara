<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paramaakshara</title>
  </head>
  <body>
    <header class="toolbar">
      <strong class="app-name">Paramaakshara</strong>
      <span id="version" class="version"></span>
      <span class="group" aria-label="File">
        <button id="file-new" type="button" disabled>New</button>
        <button id="file-open" type="button" title="Open (⌘O)" disabled>
          Open…
        </button>
        <button id="file-save" type="button" title="Save (⌘S)" disabled>
          Save
        </button>
        <button id="file-save-as" type="button" title="Save as (⇧⌘S)" disabled>
          Save as…
        </button>
        <button
          id="file-import"
          type="button"
          title="Open a file from anywhere on this computer"
          disabled
        >
          Import…
        </button>
        <button
          id="baraha"
          type="button"
          title="Paste text typed in Baraha; # q $ and Baraha letters are rewritten in ITRANS"
        >
          Baraha…
        </button>
        <button
          id="file-export"
          type="button"
          title="Download the Unicode output as a .txt file"
        >
          Export .txt
        </button>
      </span>
      <span id="docname" class="docname"></span>
      <span class="spacer"></span>
      <button
        id="regen-line"
        type="button"
        title="Replace the output of the current line with the transliteration of its ITRANS"
      >
        Regenerate line
      </button>
      <button
        id="regen-all"
        type="button"
        title="Replace every manually edited line with the transliteration of its ITRANS"
      >
        Regenerate all
      </button>
      <span class="group" aria-label="Insert into output">
        <button
          type="button"
          data-insert="&#x0952;"
          title="Anudātta U+0952 (ITRANS _)"
        >
          ◌॒
        </button>
        <button
          type="button"
          data-insert="&#x0951;"
          title="Svarita U+0951 (ITRANS ')"
        >
          ◌॑
        </button>
        <button
          type="button"
          data-insert="&#x1CDA;"
          title="Double svarita U+1CDA (ITRANS ''')"
        >
          ◌᳚
        </button>
      </span>
      <button
        id="palette-toggle"
        type="button"
        title="Vedic symbol palette"
        aria-controls="palette"
      >
        Symbols…
      </button>
      <button
        id="cleanup"
        type="button"
        title="Fix accent order, Baraha double svarita, short e/o and colon visarga in the selection or the whole output"
      >
        Clean up…
      </button>
    </header>
    <aside id="palette" class="palette" hidden></aside>
    <main class="panes">
      <section class="pane">
        <h2>ITRANS input</h2>
        <div id="source" class="editor"></div>
      </section>
      <section class="pane">
        <h2>
          Unicode output
          <select id="script-select" title="Output script (§4.6)">
            <option value="devanagari">Devanagari</option>
            <option value="kannada">Kannada</option>
            <option value="tamil">Tamil (superscript)</option>
          </select>
        </h2>
        <div id="output" class="editor"></div>
      </section>
    </main>
    <footer class="status">
      <span id="counts"></span>
      <span id="save-state"></span>
      <span class="spacer"></span>
      <span id="converter" class="notice">ITRANS 5.3 → Devanagari</span>
    </footer>
    <div id="banner" class="banner" hidden></div>
    <dialog id="dialog"></dialog>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
